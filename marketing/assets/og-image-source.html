<!doctype html>
<!-- Source for public/og-image.png (1200×630). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
       --headless --screenshot=public/og-image.png --window-size=1200,630 \
       --hide-scrollbars marketing/assets/og-image-source.html          -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    background: #162431;
    position: relative;
    color: #fff;
  }
  /* brand glow blobs */
  .blob1 { position: absolute; top: -180px; right: -120px; width: 560px; height: 560px;
    border-radius: 50%; background: radial-gradient(circle, rgba(43,187,151,.35), transparent 70%); }
  .blob2 { position: absolute; bottom: -220px; left: -100px; width: 520px; height: 520px;
    border-radius: 50%; background: radial-gradient(circle, rgba(157,215,96,.22), transparent 70%); }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding: 0 84px; }
  .logo { font-family: "Montserrat", "Inter", sans-serif; font-weight: 800;
    font-size: 56px; letter-spacing: -0.5px; }
  .logo .ly { color: #2BBB97; }
  h1 { font-size: 64px; font-weight: 800; line-height: 1.08; letter-spacing: -1.5px;
    margin-top: 36px; max-width: 900px; }
  h1 .accent { color: #9DD760; }
  .sub { margin-top: 26px; font-size: 30px; font-weight: 600; color: #cbd5e1; }
  .langs { margin-top: 40px; display: flex; gap: 14px; }
  .pill { border: 2px solid rgba(43,187,151,.6); color: #2BBB97; border-radius: 999px;
    padding: 10px 26px; font-size: 24px; font-weight: 700; }
  .free { position: absolute; top: 64px; right: 84px; background: #9DD760; color: #162431;
    border-radius: 999px; padding: 12px 30px; font-size: 26px; font-weight: 800; }
</style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="free">Free on iOS &amp; Android</div>
  <div class="wrap">
    <div class="logo">oz<span class="ly">ly</span></div>
    <h1>Invoices, Jobs &amp; Taxes for ABN workers — <span class="accent">in one app</span></h1>
    <div class="sub">Built for sole traders &amp; contractors in Australia</div>
    <div class="langs">
      <div class="pill">English</div>
      <div class="pill">Português</div>
      <div class="pill">Español</div>
    </div>
  </div>
</body>
</html>
