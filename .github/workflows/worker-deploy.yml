name: Deploy Worker to Cloudflare

# The blog AI-authoring API + affiliate OG worker (ozly-og-worker) lives in
# cloudflare-worker/. Before this, it only deployed via a manual `wrangler
# deploy` from a laptop — so worker merges never showed up in Actions and could
# silently NOT reach production. Now every push to main that touches the worker
# deploys it automatically, visible here like every other workflow.
on:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Type-check
        working-directory: cloudflare-worker
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
