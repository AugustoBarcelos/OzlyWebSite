name = "ozly-og-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Routes: /v/:code (affiliate OG) and /admin/api/* (blog AI-authoring API).
# Everything else — including the static /admin page — goes to GitHub Pages.
routes = [
  { pattern = "ozly.au/v/*", zone_name = "ozly.au" },
  { pattern = "ozly.au/admin/api/*", zone_name = "ozly.au" },
  # Public blog: SSR + JSON API served from Supabase.
  { pattern = "ozly.au/blog-api/*", zone_name = "ozly.au" },
  { pattern = "ozly.au/blog", zone_name = "ozly.au" },
  { pattern = "ozly.au/blog/*", zone_name = "ozly.au" },
  # Guides: same SSR engine as the blog (kind='guide').
  { pattern = "ozly.au/guias", zone_name = "ozly.au" },
  { pattern = "ozly.au/guias/*", zone_name = "ozly.au" },
  { pattern = "ozly.au/pt/blog", zone_name = "ozly.au" },
  { pattern = "ozly.au/pt/blog/*", zone_name = "ozly.au" },
  { pattern = "ozly.au/es/blog", zone_name = "ozly.au" },
  { pattern = "ozly.au/es/blog/*", zone_name = "ozly.au" },
]

# Public, non-secret values. The anon Supabase key is safe in client
# code (RLS protects everything sensitive). Set via wrangler secret
# if you'd rather encrypt them — not needed here.
[vars]
SUPABASE_URL = "https://jnhwgwnphlnhjlgygjql.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaHdnd25waGxuaGpsZ3lnanFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODU2OTYsImV4cCI6MjA5MDc2MTY5Nn0.e4ayCaCsr3YEzYwsU2RpP-1DpCuCIYaBX-ba_7wz6hw"

# Workers AI binding — powers the blog's "Generate with AI" button (free tier).
[ai]
binding = "AI"

# Observability — Worker logs flow to Cloudflare Tail (free plan included).
[observability]
enabled = true
